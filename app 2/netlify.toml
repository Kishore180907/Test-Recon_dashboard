[build]
  publish = "public"
  command = "echo 'static site — functions build themselves'"
  # Always build. Netlify's "skip when nothing changed in the base directory"
  # check ran `git diff` against a base directory whose name contains a space,
  # matched nothing, and cancelled every push for two days — the site quietly
  # kept serving an old commit while GitHub showed the fixes as merged.
  # Exiting non-zero tells Netlify never to skip. Builds here are a two-second
  # echo, so there is nothing to save by skipping them.
  ignore = "/bin/false"

[functions]
  node_bundler = "esbuild"
  directory = "netlify/functions"

# The cron lives here, not only in scheduled-sync.mjs.
#
# That file exports `config = { schedule: process.env.SYNC_CRON || '*/15 * * * *' }`.
# Netlify reads an in-code config by parsing the source at build time, not by
# running it, so a computed expression is not a cron string it can recognise —
# the function deployed fine and was simply never registered on a schedule.
# It sat there for days: no invocations, no log lines, and a dashboard whose
# data only ever moved when someone pressed Refresh now.
#
# A schedule declared here is read straight from the config file, so there is
# no expression to misparse. Keep this in step with SYNC_INTERVAL_MINUTES,
# which is only the label the header shows.
[functions."scheduled-sync"]
  schedule = "*/15 * * * *"

# Give the on-demand endpoints headroom inside the sync-function ceiling.
[functions."sync-now"]
  timeout = 26

[functions."data"]
  timeout = 15

# Calls Shopify for one order, so give it more than the 10s default. A long
# journey pages a few times; 15s is comfortable and still fails fast.
[functions."journey"]
  timeout = 15

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"

[dev]
  framework = "#static"
  publish = "public"
  targetPort = 8888
